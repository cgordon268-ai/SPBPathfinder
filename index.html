<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NI Pathways Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Access screen: same St Paul's look as the tool (light heading band, maroon, navy, gold rule). */
:root{--bg:#f6f5f3;--surface:#fff;--ink:#1f2340;--muted:#6b6b72;--line:#e4e1e3;--accent:#7a1f35;--gold:#f2ae2e;--navy:#1c2a5c;--warn:#9a4a00;--warn-soft:#fff4e5;
  --display:"Libre Baskerville",Georgia,serif;--body:"Open Sans","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#fff;color:var(--ink);font-family:var(--body);line-height:1.5;display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.card{background:var(--bg);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:14px;max-width:440px;width:100%;padding:28px 24px;display:grid;gap:14px;justify-items:center;text-align:center}
.card img{width:130px;height:auto}
.kicker{font-size:.85rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
h1{font-family:var(--display);color:var(--navy);font-size:1.6rem;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0;color:var(--muted)}
form{display:grid;gap:10px;width:100%}
label{font-weight:700;text-align:left}
input[type=text]{font:inherit;font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:10px 12px;border:2px solid var(--line);border-radius:10px;width:100%}
input[type=text]:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;font-size:.9rem;color:var(--muted);font-weight:400}
button{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px;cursor:pointer;font-size:1rem}
button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
.err{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.92rem}
[hidden]{display:none!important}
.small{font-size:.82rem}
</style>
</head>

const KEY = "spbPathwaysCode";
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function unlock(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.data));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const norm = c => c.trim().toUpperCase().replace(/\s+/g,"");
const f=document.getElementById("f"), err=document.getElementById("err"), go=document.getElementById("go");
f.addEventListener("submit", async e=>{
  e.preventDefault();
  const code=norm(document.getElementById("code").value);
  err.hidden=true; go.disabled=true; go.textContent="Checking…";
  try{
    const html=await unlock(code);
    try{ if(document.getElementById("remember").checked) localStorage.setItem(KEY, code); else localStorage.removeItem(KEY); }catch(_){}
    show(html);
  }catch(_){
    err.textContent="That code isn't right. Check it and try again."; err.hidden=false;
    go.disabled=false; go.textContent="Open the careers tool";
  }
});
(async()=>{
  if(!window.crypto || !crypto.subtle){ err.textContent="This browser can't open the tool. Try Chrome, Edge or Safari."; err.hidden=false; go.disabled=true; return; }
  let saved=null; try{ saved=localStorage.getItem(KEY); }catch(_){}
  if(saved){ try{ show(await unlock(saved)); }catch(_){ try{ localStorage.removeItem(KEY); }catch(__){} } }
})();
</script>
